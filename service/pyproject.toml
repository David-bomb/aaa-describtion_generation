[project]
name = "avito-qwen-description-service"
version = "0.1.0"
description = "Local GPU service for generating Avito-style product descriptions from image, title, category, and params."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
